alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602915
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602915
    runbook: docs/alerts.md#alert-2
  - name: CostSpikeDetected
    severity: warning
    condition: sum(cost_usd) > 2.5
    duration: 1h
    type: symptom-based
    channel: slack
    owner: student-2A202602915
    runbook: docs/alerts.md#alert-3
